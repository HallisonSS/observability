global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: 'localhost:9100'
      
  - job_name: 'alertmanager'
    static_configs:
      - targets: 'alertmanager:9093'
      
  - job_name: "ia-server"
    static_configs:
      - targets:
          - "10.50.0.10:9100"
          
  - job_name: "docker"
    static_configs:
      - targets:
          - "10.50.0.10:8080"
      
rule_files:
  - /etc/prometheus/alerts.yml
